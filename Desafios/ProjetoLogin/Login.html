<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesso ao Sistema</title>
    
    <link rel="stylesheet" href="estiloLogin/style.css">
    <link rel="stylesheet" href="estiloLogin/MediaQuery.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons"
      rel="stylesheet">
    
</head>
<body>
    <main>
        <section id="login">
            <div id="imagem">

            </div>
            <h1>Login</h1>
            <p>Olá! Faça login para configurar seu ambiente pessoal.</p>
        <!-- </section> -->
        <!-- <section> -->
            <div id="form">
                <form action="login.php  " method="post" autocomplete="on">
                    <i class="material-icons">person</i>
                    <input type="email" name="login" id="ilogin" placeholder="Insira seu Email" required autocomplete="email">
                    <label for="ilogin">Login:</label>
                   
                    <i class="material-icons">vpn_key</i>
                    <input type="password" name="senha" id="isenha" placeholder="Insira sua senha" required autocomplete="current-password">
                    <label for="isenha">Senha:</label>
                    <div>
                        <input id="inputEntrar" type="submit" value="Entrar">
                        <a href="esqueci.html" class="botão">
                            Esqueci a senha <i class="material-icons">mail</i>  
                        </a>
                    </div>
                </form>
            </div>
        <!-- </section> -->
    </main>
</body>
</html>
